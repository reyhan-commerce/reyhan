services:
  app:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: "${DOMAIN:-localhost}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://${DOMAIN:-localhost}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-easyshop}"
      DB_USERNAME: "${DB_USERNAME:-easyshop}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      OCTANE_SERVER: frankenphp
    volumes:
      - storage_data:/app/storage/app
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - easyshop-network

  worker:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "horizon"]
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_DATABASE: "${DB_DATABASE:-easyshop}"
      DB_USERNAME: "${DB_USERNAME:-easyshop}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    volumes:
      - storage_data:/app/storage/app
    depends_on:
      - app
    networks:
      - easyshop-network

  scheduler:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      REDIS_HOST: redis
    volumes:
      - storage_data:/app/storage/app
    depends_on:
      - app
    networks:
      - easyshop-network

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: "https://${DOMAIN:-localhost}/api/v1"
      NUXT_PUBLIC_SITE_URL: "https://${DOMAIN:-localhost}"
    depends_on:
      - app
    networks:
      - easyshop-network

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-easyshop}"
      POSTGRES_USER: "${DB_USERNAME:-easyshop}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-secret}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-easyshop} -d ${DB_DATABASE:-easyshop}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - easyshop-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - easyshop-network

volumes:
  postgres_data:
  redis_data:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  easyshop-network:
    driver: bridge
