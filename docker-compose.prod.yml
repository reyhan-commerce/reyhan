services:
  app:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SERVER_NAME: "${DOMAIN:-localhost}"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "https://${DOMAIN:-localhost}"
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-easyshop}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      OCTANE_SERVER: frankenphp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/app/storage/app
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - reyhan-network

  worker:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "horizon"]
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-easyshop}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      QUEUE_CONNECTION: redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/app/storage/app
    depends_on:
      - app
    networks:
      - reyhan-network

  scheduler:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:-host.docker.internal}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-easyshop}"
      DB_USERNAME: "${DB_USERNAME:-postgres}"
      DB_PASSWORD: "${DB_PASSWORD:-}"
      REDIS_HOST: "${REDIS_HOST:-host.docker.internal}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - storage_data:/app/storage/app
    depends_on:
      - app
    networks:
      - reyhan-network

  frontend:
    build:
      context: ./frontend
      target: runner
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_BASE: "https://${DOMAIN:-localhost}/api/v1"
      NUXT_PUBLIC_SITE_URL: "https://${DOMAIN:-localhost}"
    depends_on:
      - app
    networks:
      - reyhan-network

volumes:
  storage_data:
  caddy_data:
  caddy_config:

networks:
  reyhan-network:
    driver: bridge
