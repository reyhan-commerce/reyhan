name: Core CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Tests & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: reyhan_test
          POSTGRES_USER: reyhan
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, redis, bcmath, intl, mbstring, curl, zip
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build Assets
        run: |
          npm ci
          npm run build

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Code Style (Laravel Pint)
        run: ./vendor/bin/pint --test

      - name: Configure Test Environment
        run: |
          cp .env.example .env
          php artisan storage:link
          php artisan migrate --force
        env:
          APP_KEY: base64:4TqFwYfTqFwYfTqFwYfTqFwYfTqFwYfTqFwYfTqFwYc=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: reyhan_test
          DB_USERNAME: reyhan
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run Test Suite (Pest)
        run: ./vendor/bin/pest --colors=always
        env:
          APP_KEY: base64:4TqFwYfTqFwYfTqFwYfTqFwYfTqFwYfTqFwYfTqFwYc=
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: reyhan_test
          DB_USERNAME: reyhan
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
